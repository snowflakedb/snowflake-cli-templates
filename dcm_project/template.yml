minimum_cli_version: "3.16.0"
files_to_render:
  - manifest.yml
variables:
  - name: account_identifier
    prompt: "Account locator (<organization_name>-<account_identifier>). Hyphens are kept; this is not a Snowflake object identifier."
    type: string
    default_computed: connection.account
  - name: project_owner
    prompt: "Role with OWNERSHIP on this project object. Unquoted names rewrite spaces/hyphens to underscores; wrap in double quotes to keep them (\"My Role\")."
    type: string
    default_computed: connection.role
  - name: db_name
    prompt: "Database for this project object. Unquoted names rewrite spaces/hyphens to underscores; wrap in double quotes to keep them."
    type: string
    default_computed: connection.db
  - name: schema_name
    prompt: "Schema for this project object. Unquoted names rewrite spaces/hyphens to underscores; wrap in double quotes to keep them."
    type: string
    default_computed: connection.schema
  - name: project_name
    prompt: "Name of this project object. Unquoted names rewrite spaces/hyphens to underscores; wrap in double quotes to keep them (\"My Project\"). _DEV is appended inside the identifier."
    default: DCM_PROJECT
    type: string
