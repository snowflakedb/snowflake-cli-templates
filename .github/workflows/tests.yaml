name: Run tests

on:
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        cli_version: ['-labs==2.7.0', '-labs==2.8.0', ''] # check 2.X and latest release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Snowflake CLI
        # This job runs snow init against the PR tree, so install the CLI with pip.
        # Keep click below 8.3 (8.3 broke older labs CLIs). Do not pin 8.2.1:
        # current snowflake-cli requires click==8.1.8, and 8.2.1 makes pip
        # backtrack to 3.7.x whose `snow snowpark build` fails.
        run: python -m pip install pytest snowflake-snowpark-python 'click<8.3' snowflake-cli${{ matrix.cli_version }}
      - name: Run tests
        run: python -m pytest .tests/ -vv
