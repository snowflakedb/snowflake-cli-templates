minimum_cli_version: "3.0.0"
files_to_render:
  - snowflake.yml
  - README.md
  - setup.sql
variables:
  - name: database_name
    prompt: "Database where the application will be created. Unquoted names rewrite spaces/hyphens to underscores; wrap in double quotes to keep them."
    type: string
  - name: schema_name
    prompt: "Schema where the application will be created. Unquoted names rewrite spaces/hyphens to underscores; wrap in double quotes to keep them."
    type: string
    default: public
  - name: warehouse_name
    prompt: "Warehouse used by the application. Unquoted names rewrite spaces/hyphens to underscores; wrap in double quotes to keep them (\"My Warehouse\")."
    type: string
  - name: stage_name
    prompt: "Stage for the application. Unquoted names rewrite spaces/hyphens to underscores; wrap in double quotes to keep them."
    default: dev_deployment
    type: string
  - name: secret_name
    prompt: "Secret name used by the application. Unquoted names rewrite spaces/hyphens to underscores; wrap in double quotes to keep them."
    type: string
    default: streamlit_secret
  - name: external_access_integration_name
    prompt: "External access integration name. Unquoted names rewrite spaces/hyphens to underscores; wrap in double quotes to keep them. Used in both snowflake.yml and setup.sql."
    type: string
    default: streamlit_external_access_integration
